[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spec-trace"
version = "0.1.0"
description = "Force a written spec before any code change. Logs every edit with a backlink."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Amey Ambade", email = "ameyambade@gmail.com" }]
dependencies = [
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
spec-trace = "spec_trace.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_trace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]
ignore = ["E501"]  # line length handled by formatter
exclude = ["evals/fixtures/**/starting_state/**"]

[tool.ruff.format]
quote-style = "double"
