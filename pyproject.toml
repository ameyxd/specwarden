[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specwarden"
version = "0.2.1"
description = "Force a written spec before any code change. Logs every edit with a backlink."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Amey Ambade", email = "ameyambade@gmail.com" }]
dependencies = [
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Pinned to a minor range on purpose. CI installed `ruff>=0.5`, resolved to
    # whatever was newest, and went red when 0.16 began formatting Python inside
    # markdown code blocks — a change unrelated to anything in the diff. An
    # unpinned formatter means any upstream release can break an unrelated PR.
    "ruff>=0.16,<0.17",
]

[project.scripts]
specwarden = "specwarden.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/specwarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["evals/fixtures/**/starting_state/**", "examples/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
